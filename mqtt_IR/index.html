<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>IR Sensor Live Data</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
      background: #121212;
      color: #00ff99;
    }

    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
      margin: 0 auto;
      box-shadow: 0 0 15px rgba(0, 255, 100, 0.4);
    }

    h1 {
      color: #0f0;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>IR Sensor Data</h1>
    <h2 id="data">--</h2>
  </div>

  <script>
    // Connect to MQTT broker (Mosquitto via WebSocket)
    
    // listener 1883
    // protocol mqtt

    // listener 8083
    // protocol websockets

    // allow_anonymous true

    const broker = "ws://172.20.10.5:8083"; // your PC IP
    const topic = "sensor/ir";

    const client = mqtt.connect(broker);
    const dataEl = document.getElementById("data");

    client.on("connect", () => {
      console.log("Connected to MQTT broker");
      client.subscribe(topic);
    });

    client.on("message", (t, message) => {
      if (t === topic) {
        dataEl.textContent = message.toString();
      }
    });

    client.on("error", (err) => {
      console.error("Connection error:", err);
    });
  </script>
</body>

</html>
