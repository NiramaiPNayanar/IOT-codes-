<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ESP32 Speedometer Game</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  body {
    background-color: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    padding-top: 50px;
  }
  h2 {
    color: #00b4d8;
   
  }
  input {
    padding: 10px;
    width: 120px;
    border-radius: 6px;
    border: none;
    text-align: center;
    font-size: 1.1em;
  }
  button {
    background-color: #00b4d8;
    color: white;
    border: none;
    padding: 10px 18px;
    margin-left: 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover {
    background-color: #0077b6;
  }
  #result {
    margin-top: 20px;
    font-size: 1.2em;
  }
</style>
</head>
<body>

  <h2>ESP32 Speedometer Challenge</h2>
  <p>Guess the speediometer value!</p>

  <input type="number" id="guess" placeholder="Enter speed">
  <button onclick="sendGuess()">Submit Guess</button>

  <div id="result"></div>

  <script>
    const broker = "wss://test.mosquitto.org:8081"; 
    const client = mqtt.connect(broker);

    client.on("connect", () => {
      console.log("Connected to MQTT broker");
      client.subscribe("speedometer/data");
    });

    client.on("message", (topic, message) => {
      const msg = message.toString();
      console.log("Received:", msg);
      document.getElementById("result").innerHTML = ` `;

      const data = msg.replace(/[<>]/g, "").split(",");
      const userVal = parseInt(data[0]);
      const sensorVal = parseInt(data[1]);

      if (userVal === sensorVal) {
        document.getElementById("result").innerHTML += `<br><span style='color:#00ff99'>Congrats! You got it right.</span>`;
      } else {
        document.getElementById("result").innerHTML += `<br><span style='color:#ff4d4d'>Try Again.</span>`;
      }
    });

    function sendGuess() {
      const val = document.getElementById("guess").value;
      if (val === "") {
        alert("Please enter a number");
        return;
      }
      client.publish("speedometer/guess", val);
      console.log("Sent guess:", val);
    }
  </script>

</body>
</html>
